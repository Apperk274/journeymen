plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
        tfcClient {
            client()
            gameDirectory = project.file('run-tfc')
        }
        tfcServer {
            server()
            gameDirectory = project.file('run-tfc')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.register('syncTfcMods', Sync) {
    group = 'journeymen'
    description = 'Copies the TFC test mods listed in tfc-test-mods.txt from a TerraFirma Rebirth instance into run-tfc/mods.'
    def instance = file(findProperty('tfc_instance') ?: "${System.getProperty('user.home')}/curseforge/minecraft/Instances/TerraFirma Rebirth 2")
    def patterns = file('tfc-test-mods.txt').readLines().collect { it.trim() }.findAll { it }
    from(new File(instance, 'mods')) {
        patterns.each { include it }
    }
    into 'run-tfc/mods'
}
